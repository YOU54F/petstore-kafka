# Petstore Kafka CI (Gitea Actions, GitHub Actions syntax). Gitea reads .gitea/workflows in preference to .github/workflows.
#
# Contract tests: adoptions-service and websocket-service consume pets-service's Kafka messages, and web-ui consumes its
# REST API. adoptions-service is also a provider: petstore-inc's notifications consumes the pets.statusChanged messages
# it sends, with the adopter's id. The consumer pacts publish to a broker when PACT_BROKER_BASE_URL is set (a repo
# variable), then both providers verify them and can-i-deploy gates each pacticipant. Without a broker, verify uses the
# pacts from this run (notifications' pact is only on the broker, so adoptions-service's verification is skipped).
#
# Behind a TLS-intercepting proxy, job containers need the proxy CA mounted at /etc/ssl/certs/ca-certificates.crt (see
# the runner config in smartbear-all-the-things/infra/gitea).
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  npm_config_ignore_scripts: "true"   # never run dependency install scripts in CI
  PACT_DO_NOT_TRACK: "true"
  PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
  PACT_BROKER_USERNAME: ${{ vars.PACT_BROKER_USERNAME }}

jobs:
  services:
    name: Services (unit tests, consumer pacts)
    runs-on: ubuntu-latest
    env:
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
      PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/package-lock.json
      - working-directory: services
        run: npm ci --ignore-scripts
      - working-directory: services
        run: npm test
      - working-directory: services
        run: npm run test:pact:consumer
      - uses: actions/upload-artifact@v3   # v4 isn't supported by Gitea's artifact server
        with:
          name: pacts-services
          path: services/pacts
      - name: Publish pacts
        if: ${{ vars.PACT_BROKER_BASE_URL != '' }}
        working-directory: services
        run: |
          [ -n "$PACT_BROKER_TOKEN" ] || unset PACT_BROKER_TOKEN   # an empty token gets a 400 from the broker
          npm run pact:publish

  web-ui:
    name: web-ui (typecheck, build, consumer pact)
    runs-on: ubuntu-latest
    env:
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
      PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - working-directory: web-ui
        run: npm ci --ignore-scripts
      - working-directory: web-ui
        run: npm run build
      - working-directory: web-ui
        run: npm test
      - uses: actions/upload-artifact@v3
        with:
          name: pacts-web-ui
          path: web-ui/pacts
      - name: Publish pacts
        if: ${{ vars.PACT_BROKER_BASE_URL != '' }}
        working-directory: web-ui
        run: |
          [ -n "$PACT_BROKER_TOKEN" ] || unset PACT_BROKER_TOKEN   # an empty token gets a 400 from the broker
          npm run pact:publish

  verify:
    name: Verify pets-service and adoptions-service (Kafka messages + REST)
    runs-on: ubuntu-latest
    needs: [services, web-ui]
    env:
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
      PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/package-lock.json
      # Used only without a broker; with one, the verifier fetches pacts by consumer version selectors.
      - uses: actions/download-artifact@v3
        with:
          name: pacts-services
          path: services/pacts
      - uses: actions/download-artifact@v3
        with:
          name: pacts-web-ui
          path: web-ui/pacts
      - working-directory: services
        run: npm ci --ignore-scripts
      # Publishes verification results to the broker when one is set (CI=true).
      - working-directory: services
        run: npm run test:pact:provider

  # Gates each pacticipant on what is deployed to the local environment. On main, deploy does this itself.
  can-i-deploy:
    name: Pact can-i-deploy (${{ matrix.pacticipant }})
    runs-on: ubuntu-latest
    needs: [verify]
    if: ${{ vars.PACT_BROKER_BASE_URL != '' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    strategy:
      fail-fast: false
      matrix:
        pacticipant: [pets-service, adoptions-service, websocket-service, web-ui]
    env:
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
      PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/package-lock.json
      - working-directory: services
        run: npm ci --ignore-scripts
      - working-directory: services
        run: |
          [ -n "$PACT_BROKER_TOKEN" ] || unset PACT_BROKER_TOKEN   # an empty token gets a 400 from the broker
          npm run pact:can-i-deploy -- --pacticipant "${{ matrix.pacticipant }}" --version "${{ github.sha }}"

  # Main is what's "deployed" to the local environment. The provider goes first, so that the consumers' can-i-deploy
  # finds the pets-service version they were verified against.
  deploy:
    name: Record deployments to local
    runs-on: ubuntu-latest
    needs: [verify]
    if: ${{ vars.PACT_BROKER_BASE_URL != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    env:
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
      PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/package-lock.json
      - working-directory: services
        run: npm ci --ignore-scripts
      - working-directory: services
        run: |
          [ -n "$PACT_BROKER_TOKEN" ] || unset PACT_BROKER_TOKEN   # an empty token gets a 400 from the broker
          for pacticipant in pets-service adoptions-service websocket-service web-ui; do
            npm run pact:can-i-deploy -- --pacticipant "$pacticipant" --version "${{ github.sha }}"
            npm run pact:record-deployment -- --pacticipant "$pacticipant" --version "${{ github.sha }}"
          done

  compose:
    name: Compose files are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config -q
      - run: CA_PEM=placeholder docker compose -f docker-compose.yml -f docker-compose.ca.yml config -q
