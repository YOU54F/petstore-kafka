# Petstore Kafka CI, for both GitHub Actions and Gitea Actions (Gitea reads .github/workflows too, as long as there is
# no .gitea/workflows, which would take precedence). Where the two differ, the workflow tells them apart with
# github.server_url == 'https://github.com':
#   - matrices: GitHub has no matrix context in a job's `if`, so the `lanes` job turns the repo variables into the
#     list of broker lanes each matrix runs, and jobs with no lane are skipped
#   - Kafka: on Gitea the service container shares the job's network namespace (and Docker rejects published ports);
#     on GitHub the job runs on the VM, so asyncapi starts its own Kafka on the host network
#   - concurrency: the asyncapi queue is only needed on Gitea (shared ports); GitHub runners are isolated, and queueing
#     there would cancel other runs' pending asyncapi jobs
#

# Contract tests: adoptions-service and websocket-service consume pets-service's Kafka messages, and web-ui consumes its
# REST API. adoptions-service is also a provider: petstore-inc's notifications consumes the pets.statusChanged messages
# it sends, with the adopter's id. Each provider's messages are a pacticipant of their own, pets-service-events and
# adoptions-service-events, whose provider contracts are the AsyncAPI documents; pets-service keeps web-ui's REST pact.
# The consumer pacts publish to a broker when PACT_BROKER_BASE_URL is set (a repo variable), then the providers verify
# them and can-i-deploy gates each pacticipant. Without a broker, verify uses the pacts from this run (notifications'
# pact is only on the broker, so adoptions-service-events' verification is skipped). The pacts are also committed, and
# the consumer jobs fail if a run changes them.
#
# Broker lanes, as in petstore-inc: every job that talks to a Pact Broker runs once per lane in matrix.broker:
#   oss       the Pact Broker in vars.PACT_BROKER_BASE_URL (basic auth), always
#   pactflow  PactFlow (vars.PACTFLOW_BASE_URL, token in secrets.PACTFLOW_TOKEN) when vars.PACTFLOW_ENABLED is 'true'
# The lanes are independent tracks of the same pacts and verifications, each with its own can-i-deploy and deployments;
# neither reads the other. Each job maps its lane onto the PACT_BROKER_* variables (PactFlow blanks the basic-auth
# pair). PactFlow-lane job names end in "· PactFlow". petstore-inc's franchisee job publishes these pacticipants to
# the same PactFlow tenant at a pinned commit of this repo: both use this repo's SHAs as versions, so they add up
# rather than collide.
#
# AsyncAPI: specs/asyncapi documents what pets-service and adoptions-service publish and consume, and the message pacts
# reference its operationIds. The asyncapi job checks the committed pacts against it (openapi-pact-comparator) and,
# with PactFlow enabled, runs Drift against the real services on a throwaway broker (services/drift/run-asyncapi.sh).
# The PactFlow lane publishes each document, with Drift's results, as the provider contract of pets-service-events and
# adoptions-service-events.
#
# Concurrency: a newer run of a ref cancels the older one. Service containers share one network namespace on Gitea, so
# the jobs that bind fixed ports (asyncapi's Kafka and Drift) also queue per lane across all runs of this repo.
#
# Behind a TLS-intercepting proxy, job containers need the proxy CA mounted at /etc/ssl/certs/ca-certificates.crt (see
# the runner config in smartbear-all-the-things/infra/gitea).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  npm_config_ignore_scripts: "true"   # never run dependency install scripts in CI
  PACT_DO_NOT_TRACK: "true"

jobs:
  # Which broker lanes run: oss when a Pact Broker is configured (the services and verify jobs run it regardless, to
  # work without a broker), pactflow when enabled.
  lanes:
    name: Broker lanes
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.lanes.outputs.all }}
      gated: ${{ steps.lanes.outputs.gated }}
    steps:
      - id: lanes
        env:
          OSS_URL: ${{ vars.PACT_BROKER_BASE_URL }}
          PACTFLOW_ENABLED: ${{ vars.PACTFLOW_ENABLED }}
        run: |
          # all: every job runs the oss lane; gated: only lanes with a broker to talk to (can-i-deploy, deploy)
          all='"oss"'; gated=''
          [ -z "$OSS_URL" ] || gated='"oss"'
          if [ "$PACTFLOW_ENABLED" = true ]; then
            all="$all,\"pactflow\""
            gated="${gated:+$gated,}\"pactflow\""
          fi
          echo "all=[$all]" >> "$GITHUB_OUTPUT"
          echo "gated=[$gated]" >> "$GITHUB_OUTPUT"

  services:
    name: Services (unit tests, consumer pacts)${{ matrix.broker == 'pactflow' && ' · PactFlow' || '' }}
    runs-on: ubuntu-latest
    needs: [lanes]
    strategy:
      matrix:
        broker: ${{ fromJSON(needs.lanes.outputs.all) }}
    env:
      PACT_BROKER_BASE_URL: ${{ matrix.broker == 'pactflow' && vars.PACTFLOW_BASE_URL || vars.PACT_BROKER_BASE_URL }}
      PACT_BROKER_TOKEN: ${{ matrix.broker == 'pactflow' && secrets.PACTFLOW_TOKEN || secrets.PACT_BROKER_TOKEN }}
      PACT_BROKER_USERNAME: ${{ matrix.broker != 'pactflow' && vars.PACT_BROKER_USERNAME || '' }}
      PACT_BROKER_PASSWORD: ${{ matrix.broker != 'pactflow' && secrets.PACT_BROKER_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/package-lock.json
      - working-directory: services
        run: npm ci --ignore-scripts
      - working-directory: services
        run: npm test
      - working-directory: services
        run: npm run test:pact:consumer
      - name: Check the committed pacts are current
        run: |   # pacts are committed so other repos (petstore-inc's franchisee job) can verify against them by SHA
          git diff --exit-code -- services/pacts
          [ -z "$(git ls-files --others --exclude-standard -- services/pacts)" ] || { echo "untracked pacts: commit them"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: pacts-services-${{ matrix.broker }}
          path: services/pacts
      - name: Publish pacts
        if: ${{ env.PACT_BROKER_BASE_URL != '' }}
        working-directory: services
        run: |
          [ -n "$PACT_BROKER_TOKEN" ] || unset PACT_BROKER_TOKEN   # an empty token gets a 400 from the broker
          npm run pact:publish

  web-ui:
    name: web-ui (typecheck, build, consumer pact)${{ matrix.broker == 'pactflow' && ' · PactFlow' || '' }}
    runs-on: ubuntu-latest
    needs: [lanes]
    strategy:
      matrix:
        broker: ${{ fromJSON(needs.lanes.outputs.all) }}
    env:
      PACT_BROKER_BASE_URL: ${{ matrix.broker == 'pactflow' && vars.PACTFLOW_BASE_URL || vars.PACT_BROKER_BASE_URL }}
      PACT_BROKER_TOKEN: ${{ matrix.broker == 'pactflow' && secrets.PACTFLOW_TOKEN || secrets.PACT_BROKER_TOKEN }}
      PACT_BROKER_USERNAME: ${{ matrix.broker != 'pactflow' && vars.PACT_BROKER_USERNAME || '' }}
      PACT_BROKER_PASSWORD: ${{ matrix.broker != 'pactflow' && secrets.PACT_BROKER_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - working-directory: web-ui
        run: npm ci --ignore-scripts
      - working-directory: web-ui
        run: npm run build
      - working-directory: web-ui
        run: npm test
      - name: Check the committed pacts are current
        run: |   # pacts are committed so other repos (petstore-inc's franchisee job) can verify against them by SHA
          git diff --exit-code -- web-ui/pacts
          [ -z "$(git ls-files --others --exclude-standard -- web-ui/pacts)" ] || { echo "untracked pacts: commit them"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: pacts-web-ui-${{ matrix.broker }}
          path: web-ui/pacts
      - name: Publish pacts
        if: ${{ env.PACT_BROKER_BASE_URL != '' }}
        working-directory: web-ui
        run: |
          [ -n "$PACT_BROKER_TOKEN" ] || unset PACT_BROKER_TOKEN   # an empty token gets a 400 from the broker
          npm run pact:publish

  verify:
    name: Verify pets-service(-events) and adoptions-service-events (REST + Kafka messages)${{ matrix.broker == 'pactflow' && ' · PactFlow' || '' }}
    runs-on: ubuntu-latest
    needs: [lanes, services, web-ui]
    strategy:
      matrix:
        broker: ${{ fromJSON(needs.lanes.outputs.all) }}
    env:
      PACT_BROKER_BASE_URL: ${{ matrix.broker == 'pactflow' && vars.PACTFLOW_BASE_URL || vars.PACT_BROKER_BASE_URL }}
      PACT_BROKER_TOKEN: ${{ matrix.broker == 'pactflow' && secrets.PACTFLOW_TOKEN || secrets.PACT_BROKER_TOKEN }}
      PACT_BROKER_USERNAME: ${{ matrix.broker != 'pactflow' && vars.PACT_BROKER_USERNAME || '' }}
      PACT_BROKER_PASSWORD: ${{ matrix.broker != 'pactflow' && secrets.PACT_BROKER_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/package-lock.json
      # Used only without a broker; with one, the verifier fetches pacts by consumer version selectors.
      - uses: actions/download-artifact@v4
        with:
          name: pacts-services-${{ matrix.broker }}
          path: services/pacts
      - uses: actions/download-artifact@v4
        with:
          name: pacts-web-ui-${{ matrix.broker }}
          path: web-ui/pacts
      - working-directory: services
        run: npm ci --ignore-scripts
      # Publishes verification results to the broker when one is set (CI=true).
      - working-directory: services
        run: |
          [ -n "$PACT_BROKER_TOKEN" ] || unset PACT_BROKER_TOKEN   # an empty token gets a 400 from the broker
          npm run test:pact:provider
      # The -events pacticipants get a version even when no consumer had a pact for them to verify (notifications'
      # pact may not be on this lane's broker), so can-i-deploy and record-deployment find one.
      - working-directory: services
        if: ${{ env.PACT_BROKER_BASE_URL != '' }}
        run: |
          [ -n "$PACT_BROKER_TOKEN" ] || unset PACT_BROKER_TOKEN
          # The CLI puts --branch into the URL path as is, so a feat/... branch 404s unless its slash is encoded.
          branch="${{ github.head_ref || github.ref_name }}"
          for pacticipant in pets-service-events adoptions-service-events; do
            npx pact-broker create-or-update-version --pacticipant "$pacticipant" --version "${{ github.sha }}" \
              --branch "${branch//\//%2F}"
          done

  # The message pacts against specs/asyncapi (both lanes), then Drift against the real services (with PactFlow).
  asyncapi:
    name: AsyncAPI (pacts vs specs, Drift)${{ matrix.broker == 'pactflow' && ' · PactFlow' || '' }}
    runs-on: ubuntu-latest
    needs: [lanes]
    strategy:
      fail-fast: false
      matrix:
        broker: ${{ fromJSON(needs.lanes.outputs.all) }}
    # This lane's ports, one run at a time on Gitea (see Concurrency above). On GitHub every run gets its own group.
    concurrency:
      group: ${{ github.server_url == 'https://github.com' && github.run_id || github.repository }}-asyncapi-${{ matrix.broker }}
      cancel-in-progress: false
    env:
      PACT_BROKER_BASE_URL: ${{ matrix.broker == 'pactflow' && vars.PACTFLOW_BASE_URL || vars.PACT_BROKER_BASE_URL }}
      PACT_BROKER_TOKEN: ${{ matrix.broker == 'pactflow' && secrets.PACTFLOW_TOKEN || secrets.PACT_BROKER_TOKEN }}
      PACT_BROKER_USERNAME: ${{ matrix.broker != 'pactflow' && vars.PACT_BROKER_USERNAME || '' }}
      PACT_BROKER_PASSWORD: ${{ matrix.broker != 'pactflow' && secrets.PACT_BROKER_PASSWORD || '' }}
      GIT_SHA: ${{ github.sha }}
      GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
    # A throwaway broker for Drift. Service containers share the job's network namespace on Gitea, so the job reaches
    # it on localhost, and each lane gets its own ports (clear of petstore-inc's 19092-19095). On GitHub the job runs on
    # the VM and can't reach it: the first step starts a Kafka on the host network there instead (Gitea rejects published
    # ports on service containers, and a `ports:` expression that is empty on Gitea doesn't parse there).
    services:
      kafka:
        image: apache/kafka:3.9.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: ${{ matrix.broker == 'pactflow' && 'PLAINTEXT://:19194,CONTROLLER://:19195' || 'PLAINTEXT://:19192,CONTROLLER://:19193' }}
          KAFKA_ADVERTISED_LISTENERS: ${{ matrix.broker == 'pactflow' && 'PLAINTEXT://localhost:19194' || 'PLAINTEXT://localhost:19192' }}
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: ${{ matrix.broker == 'pactflow' && '1@localhost:19195' || '1@localhost:19193' }}
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    steps:
      - name: Start Kafka on the host network (GitHub)
        if: ${{ github.server_url == 'https://github.com' }}
        env:
          PORT: ${{ matrix.broker == 'pactflow' && '19194' || '19192' }}
          CTRL: ${{ matrix.broker == 'pactflow' && '19195' || '19193' }}
        run: |
          docker run -d --name kafka-host --network host \
            -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller \
            -e "KAFKA_LISTENERS=PLAINTEXT://:$PORT,CONTROLLER://:$CTRL" \
            -e "KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:$PORT" \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e "KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:$CTRL" \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            apache/kafka:3.9.1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/package-lock.json
      # Each message pact's comments.references.AsyncAPI.operationId must name a send operation whose message matches.
      # pets-service-events is the only provider with committed message pacts (notifications' pact is in petstore-inc).
      - name: Message pacts match the AsyncAPI documents
        if: ${{ matrix.broker == 'oss' }}   # the same files in both lanes
        run: |
          npx --yes @pactflow/openapi-pact-comparator@2.4.0 --asyncapi specs/asyncapi/pets-service.asyncapi.yaml \
            services/pacts/adoptions-service-pets-service-events.json services/pacts/websocket-service-pets-service-events.json
      - working-directory: services
        if: ${{ vars.PACTFLOW_ENABLED == 'true' }}
        run: npm ci --ignore-scripts
      - name: Drift verify the AsyncAPI documents (and publish them in the PactFlow lane)
        if: ${{ vars.PACTFLOW_ENABLED == 'true' }}   # Drift needs a PactFlow tenant even to verify
        env:
          PACTFLOW_URL: ${{ vars.PACTFLOW_BASE_URL }}
          PACTFLOW_TOKEN: ${{ secrets.PACTFLOW_TOKEN }}
          KAFKA_BOOTSTRAP: ${{ matrix.broker == 'pactflow' && 'localhost:19194' || 'localhost:19192' }}
          # Ports of their own (petstore-inc uses 18082-18083): the harness, then pets-service and adoptions-service.
          DRIFT_SERVER_PORT: ${{ matrix.broker == 'pactflow' && '18183' || '18182' }}
          PETS_PORT: ${{ matrix.broker == 'pactflow' && '18186' || '18184' }}
          ADOPTIONS_PORT: ${{ matrix.broker == 'pactflow' && '18187' || '18185' }}
          DRIFT_PUBLISH_PROVIDER_CONTRACT: ${{ matrix.broker == 'pactflow' && 'true' || 'false' }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash services/drift/run-asyncapi.sh
      - name: Upload Drift AsyncAPI results
        if: ${{ always() && vars.PACTFLOW_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: petstore-kafka-drift-asyncapi-${{ matrix.broker }}
          path: ${{ runner.temp }}/petstore-kafka-drift-asyncapi/
          if-no-files-found: ignore

  # Gates each pacticipant on what is deployed to the local environment, per lane. On main, deploy does this itself.
  can-i-deploy:
    name: Pact can-i-deploy (${{ matrix.pacticipant }})${{ matrix.broker == 'pactflow' && ' · PactFlow' || '' }}
    runs-on: ubuntu-latest
    needs: [lanes, verify, asyncapi]
    if: ${{ needs.lanes.outputs.gated != '[]' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    strategy:
      fail-fast: false
      matrix:
        broker: ${{ fromJSON(needs.lanes.outputs.gated) }}
        pacticipant: [pets-service, pets-service-events, adoptions-service, adoptions-service-events, websocket-service, web-ui]
    env:
      PACT_BROKER_BASE_URL: ${{ matrix.broker == 'pactflow' && vars.PACTFLOW_BASE_URL || vars.PACT_BROKER_BASE_URL }}
      PACT_BROKER_TOKEN: ${{ matrix.broker == 'pactflow' && secrets.PACTFLOW_TOKEN || secrets.PACT_BROKER_TOKEN }}
      PACT_BROKER_USERNAME: ${{ matrix.broker != 'pactflow' && vars.PACT_BROKER_USERNAME || '' }}
      PACT_BROKER_PASSWORD: ${{ matrix.broker != 'pactflow' && secrets.PACT_BROKER_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/package-lock.json
      - working-directory: services
        run: npm ci --ignore-scripts
      - working-directory: services
        run: |
          [ -n "$PACT_BROKER_TOKEN" ] || unset PACT_BROKER_TOKEN   # an empty token gets a 400 from the broker
          # A fresh PactFlow workspace has no environments, and can-i-deploy --to-environment needs `local`.
          # No grep -q: exiting early breaks the CLI's pipe, and pipefail then reads that as no `local`.
          npx pact-broker list-environments | grep -w local >/dev/null || npx pact-broker create-environment --name local
          npm run pact:can-i-deploy -- --pacticipant "${{ matrix.pacticipant }}" --version "${{ github.sha }}"

  # Main is what's "deployed" to the local environment, per lane. The providers go first, so that the consumers'
  # can-i-deploy finds the pets-service(-events) version they were verified against.
  deploy:
    name: Record deployments to local${{ matrix.broker == 'pactflow' && ' · PactFlow' || '' }}
    runs-on: ubuntu-latest
    needs: [lanes, verify, asyncapi]
    if: ${{ needs.lanes.outputs.gated != '[]' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        broker: ${{ fromJSON(needs.lanes.outputs.gated) }}
    env:
      PACT_BROKER_BASE_URL: ${{ matrix.broker == 'pactflow' && vars.PACTFLOW_BASE_URL || vars.PACT_BROKER_BASE_URL }}
      PACT_BROKER_TOKEN: ${{ matrix.broker == 'pactflow' && secrets.PACTFLOW_TOKEN || secrets.PACT_BROKER_TOKEN }}
      PACT_BROKER_USERNAME: ${{ matrix.broker != 'pactflow' && vars.PACT_BROKER_USERNAME || '' }}
      PACT_BROKER_PASSWORD: ${{ matrix.broker != 'pactflow' && secrets.PACT_BROKER_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/package-lock.json
      - working-directory: services
        run: npm ci --ignore-scripts
      - working-directory: services
        run: |
          [ -n "$PACT_BROKER_TOKEN" ] || unset PACT_BROKER_TOKEN   # an empty token gets a 400 from the broker
          npx pact-broker list-environments | grep -w local >/dev/null || npx pact-broker create-environment --name local
          for pacticipant in pets-service pets-service-events adoptions-service-events adoptions-service websocket-service web-ui; do
            npm run pact:can-i-deploy -- --pacticipant "$pacticipant" --version "${{ github.sha }}"
            npm run pact:record-deployment -- --pacticipant "$pacticipant" --version "${{ github.sha }}"
          done

  compose:
    name: Compose files are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config -q
      - run: CA_PEM=placeholder docker compose -f docker-compose.yml -f docker-compose.ca.yml config -q
