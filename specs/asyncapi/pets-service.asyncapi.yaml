# pets-service's Kafka topics: what it publishes and what it consumes (services/pets).
#
# Flow: POST /api/pets publishes the new pet to pets.added. pets-service consumes pets.added itself and makes every
# new pet available (pets.statusChanged); PATCH /api/pets/{id} publishes any other status change. It also keeps its
# pets cache from both topics. adoptions-service publishes pets.statusChanged too, as adoptions move on: that is in
# adoptions-service.asyncapi.yaml, as publishPetAdoptionStatusChanged.
#
# Consumers' message pacts reference these operations by AsyncAPI operationId (services/pacts):
#   - websocket-service: publishPetAdded
#   - adoptions-service: publishPetStatusChanged
asyncapi: 3.0.0
info:
  title: Petstore Kafka pets events
  version: 1.0.0
  description: Kafka topics owned or consumed by pets-service.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  tags:
    - name: pets
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: Single-node KRaft broker from docker-compose.yml (kafka:29092 inside the network).
channels:
  petsAdded:
    address: pets.added
    description: Every pet added to a store, as POSTed to /api/pets with its id. One message per pet.
    messages:
      petAdded:
        $ref: '#/components/messages/PetAdded'
  petsStatusChanged:
    address: pets.statusChanged
    description: |
      Every change to a pet's adoption status. pets-service sends the whole pet with its new status; adoptions-service
      sends only id and status (and the adopter's id, when the adoption named one).
    messages:
      petStatusChanged:
        $ref: '#/components/messages/PetStatusChanged'
operations:
  publishPetAdded:
    action: send
    summary: pets-service publishes each pet added with POST /api/pets.
    description: websocket-service consumes it to remember where each pet is.
    channel:
      $ref: '#/channels/petsAdded'
    messages:
      - $ref: '#/channels/petsAdded/messages/petAdded'
  publishPetStatusChanged:
    action: send
    summary: pets-service publishes a pet's new status.
    description: |
      Sent when a new pet becomes available (from pets.added) and for PATCH /api/pets/{id}. adoptions-service caches
      each pet's status from it, to check adoption requests.
    channel:
      $ref: '#/channels/petsStatusChanged'
    messages:
      - $ref: '#/channels/petsStatusChanged/messages/petStatusChanged'
  onPetAdded:
    action: receive
    summary: pets-service caches each new pet as pending, then makes it available.
    description: The status change goes out on pets.statusChanged (publishPetStatusChanged).
    channel:
      $ref: '#/channels/petsAdded'
    messages:
      - $ref: '#/channels/petsAdded/messages/petAdded'
  onPetStatusChanged:
    action: receive
    summary: pets-service updates the status in its pets cache, which GET /api/pets reads.
    channel:
      $ref: '#/channels/petsStatusChanged'
    messages:
      - $ref: '#/channels/petsStatusChanged/messages/petStatusChanged'
components:
  messages:
    PetAdded:
      name: PetAdded
      title: Pet added
      contentType: application/json
      correlationId:
        location: $message.payload#/id
      payload:
        $ref: '#/components/schemas/Pet'
    PetStatusChanged:
      name: PetStatusChanged
      title: Pet status changed
      contentType: application/json
      correlationId:
        location: $message.payload#/id
      payload:
        $ref: '#/components/schemas/PetStatusChange'
  schemas:
    PetId:
      type: string
      format: uuid
      description: Generated by pets-service (crypto.randomUUID) unless the POST gave one.
    PetStatus:
      type: string
      enum: [pending, available, onhold, adopted]
    Pet:
      type: object
      required: [id]
      properties:
        id:
          $ref: '#/components/schemas/PetId'
        name:
          type: string
        location:
          type: string
          description: The store housing the pet, e.g. Plett. Websocket clients subscribe by location.
        status:
          $ref: '#/components/schemas/PetStatus'
    PetStatusChange:
      type: object
      required: [id, status]
      properties:
        id:
          $ref: '#/components/schemas/PetId'
        status:
          $ref: '#/components/schemas/PetStatus'
        name:
          type: string
        location:
          type: string
        adopterId:
          type: string
          minLength: 1
          description: Sent by adoptions-service only, when the adoption request named the adopter's customer id.
